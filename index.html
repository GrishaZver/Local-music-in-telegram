<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Music Player Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #09090b);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #71717a);
            --accent-color: #10b981; /* Сочный изумрудный неон */
            --accent-gradient: linear-gradient(135deg, #10b981, #059669);
            --card-bg: rgba(24, 24, 27, 0.7);
            --card-border: rgba(255, 255, 255, 0.06);
            --active-bg: rgba(16, 185, 129, 0.12);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 4px 8px;
        }

        .app-title {
            font-size: 16px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(90deg, #fff, #a1a1aa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            font-size: 11px;
            padding: 4px 10px;
            background: rgba(16, 185, 129, 0.1);
            color: var(--accent-color);
            border-radius: 20px;
            font-weight: 600;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        /* Главная карточка плеера */
        .player-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 24px 20px;
            border-radius: 24px;
            backdrop-filter: blur(25px);
            box-shadow: 0 16px 40px rgba(0,0,0,0.5);
            position: relative;
            overflow: hidden;
        }

        .player-hero::before {
            content: '';
            position: absolute;
            top: -50px;
            left: -50px;
            width: 150px;
            height: 150px;
            background: rgba(16, 185, 129, 0.08);
            border-radius: 50%;
            filter: blur(40px);
            z-index: 0;
        }

        .album-art {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: linear-gradient(135deg, #18181b, #27272a);
            border: 4px solid rgba(255,255,255,0.08);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            transition: transform 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 1;
        }

        .album-art.playing {
            animation: spin 12s linear infinite;
            border-color: var(--accent-color);
            box-shadow: 0 0 30px rgba(16, 185, 129, 0.35);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .track-meta {
            text-align: center;
            width: 100%;
            z-index: 1;
        }

        .track-title {
            font-size: 17px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
            letter-spacing: -0.2px;
        }

        .track-artist {
            font-size: 13px;
            color: var(--hint-color);
        }

        /* Прогресс-бар */
        .progress-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
            z-index: 1;
        }

        .progress-bar {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.1);
            height: 6px;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: #fff;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            transition: transform 0.1s;
        }

        .progress-bar::-webkit-slider-thumb:hover {
            transform: scale(1.25);
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--hint-color);
            font-weight: 500;
        }

        /* Управление дополнительное (Рандом, Повтор) */
        .extra-controls {
            display: flex;
            justify-content: space-around;
            width: 100%;
            z-index: 1;
            margin-top: -4px;
        }

        .mode-btn {
            background: none;
            border: none;
            color: var(--hint-color);
            font-size: 18px;
            cursor: pointer;
            transition: color 0.2s, transform 0.1s;
        }

        .mode-btn.active {
            color: var(--accent-color);
            text-shadow: 0 0 10px rgba(16, 185, 129, 0.5);
        }

        /* Основные кнопки управления */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            z-index: 1;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 20px;
            cursor: pointer;
            opacity: 0.75;
            transition: opacity 0.2s, transform 0.1s;
        }

        .control-btn:hover {
            opacity: 1;
        }

        .control-btn:active {
            transform: scale(0.9);
        }

        .play-pause-btn {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: var(--accent-gradient);
            color: #000;
            font-size: 22px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 6px 20px rgba(16, 185, 129, 0.4);
            transition: transform 0.15s, box-shadow 0.15s;
        }

        .play-pause-btn:active {
            transform: scale(0.94);
            box-shadow: 0 2px 10px rgba(16, 185, 129, 0.3);
        }

        /* Кнопка загрузки */
        .upload-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 14px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            backdrop-filter: blur(10px);
            transition: background 0.2s, border-color 0.2s;
        }

        .upload-btn:hover {
            background: rgba(255, 255, 255, 0.06);
            border-color: rgba(255, 255, 255, 0.12);
        }

        input[type="file"] {
            display: none;
        }

        /* Плейлист */
        .playlist-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 240px;
            overflow-y: auto;
            backdrop-filter: blur(15px);
        }

        .playlist-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 4px;
            margin-bottom: 2px;
        }

        .playlist-title {
            font-size: 12px;
            font-weight: 700;
            color: var(--hint-color);
            text-transform: uppercase;
            letter-spacing: 0.8px;
        }

        .track-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
            border: 1px solid transparent;
        }

        .track-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .track-item.active {
            background: var(--active-bg);
            border-color: rgba(16, 185, 129, 0.3);
        }

        .track-info-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
            margin-right: 10px;
            flex-grow: 1;
        }

        .track-name-list {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-delete {
            background: none;
            border: none;
            color: var(--hint-color);
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            transition: color 0.2s;
        }

        .track-delete:hover {
            color: #ef4444;
        }

        .empty-list {
            color: var(--hint-color);
            text-align: center;
            font-size: 13px;
            padding: 24px;
        }

        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.15);
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Шапка -->
        <div class="header">
            <div class="app-title">⚡️ Telegram Beats</div>
            <div class="status-badge" id="track-count">0 треков</div>
        </div>

        <!-- Основной блок плеера -->
        <div class="player-hero">
            <div class="album-art" id="album-art">🎵</div>
            
            <div class="track-meta">
                <div class="track-title" id="track-title">Трек не выбран</div>
                <div class="track-artist" id="track-artist">Ожидание воспроизведения</div>
            </div>

            <!-- Прогресс бар -->
            <div class="progress-container">
                <input type="range" class="progress-bar" id="progress-bar" value="0" min="0" max="100" step="0.1">
                <div class="time-info">
                    <span id="current-time">0:00</span>
                    <span id="total-duration">0:00</span>
                </div>
            </div>

            <!-- Доп. кнопки: Рандом и Повтор -->
            <div class="extra-controls">
                <button class="mode-btn" id="shuffle-btn" onclick="toggleShuffle()" title="Перемешать">🔀</button>
                <button class="mode-btn" id="repeat-btn" onclick="toggleRepeat()" title="Повтор">🔁</button>
            </div>

            <!-- Основные кнопки управления -->
            <div class="controls">
                <button class="control-btn" onclick="playPrev()" title="Назад">⏮</button>
                <button class="play-pause-btn" id="play-pause-btn" onclick="togglePlayPause()">▶</button>
                <button class="control-btn" onclick="playNext()" title="Вперед">⏭</button>
            </div>
        </div>

        <!-- Кнопка загрузки -->
        <label for="file-input" class="upload-btn">
            📂 Загрузить музыку (.mp3)
        </label>
        <input type="file" id="file-input" accept="audio/*" multiple onchange="handleFilesUpload(event)">

        <!-- Плейлист -->
        <div class="playlist-card">
            <div class="playlist-header">
                <div class="playlist-title">Плейлист</div>
            </div>
            <div id="playlist" style="display: flex; flex-direction: column; gap: 6px;">
                <div class="empty-list" id="empty-msg">Список пуст. Добавьте треки!</div>
            </div>
        </div>
    </div>

    <audio id="audio-player"></audio>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let db;
        const DB_NAME = 'TelegramMusicDB_Pro';
        const STORE_NAME = 'tracks';

        let tracks = [];
        let currentTrackIndex = -1;
        let isPlaying = false;
        let isShuffle = false;
        let repeatMode = 0; // 0: выкл, 1: повтор всех, 2: повтор текущего

        const audioPlayer = document.getElementById('audio-player');
        const playlistEl = document.getElementById('playlist');
        const trackTitleEl = document.getElementById('track-title');
        const trackArtistEl = document.getElementById('track-artist');
        const emptyMsgEl = document.getElementById('empty-msg');
        const albumArtEl = document.getElementById('album-art');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const totalDurationEl = document.getElementById('total-duration');
        const trackCountEl = document.getElementById('track-count');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const repeatBtn = document.getElementById('repeat-btn');

        // Инициализация IndexedDB
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    loadTracksFromDB();
                    resolve(db);
                };
                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    if (!database.objectStoreNames.contains(STORE_NAME)) {
                        database.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                    }
                };
            });
        }

        async function handleFilesUpload(event) {
            const files = event.target.files;
            if (!files.length) return;

            for (let file of files) {
                await saveTrackToDB(file);
            }
            event.target.value = '';
            loadTracksFromDB();
        }

        function saveTrackToDB(file) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const trackData = {
                    name: file.name.replace(/\.[^/.]+$/, ""),
                    file: file,
                    dateAdded: new Date()
                };
                const request = store.add(trackData);
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        function loadTracksFromDB() {
            const transaction = db.transaction([STORE_NAME], 'readonly');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.getAll();

            request.onsuccess = () => {
                tracks = request.result;
                trackCountEl.innerText = `${tracks.length} трек${getDeclension(tracks.length)}`;
                renderPlaylist();
            };
        }

        function getDeclension(count) {
            if (count % 10 === 1 && count % 100 !== 11) return '';
            if ([2, 3, 4].includes(count % 10) && ![12, 13, 14].includes(count % 100)) return 'а';
            return 'ов';
        }

        function deleteTrackFromDB(id, event) {
            event.stopPropagation();
            const transaction = db.transaction([STORE_NAME], 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.delete(id);

            request.onsuccess = () => {
                const deletedIndex = tracks.findIndex(t => t.id === id);
                if (deletedIndex === currentTrackIndex) {
                    audioPlayer.pause();
                    audioPlayer.src = '';
                    currentTrackIndex = -1;
                    resetPlayerUI();
                } else if (deletedIndex < currentTrackIndex) {
                    currentTrackIndex--;
                }
                loadTracksFromDB();
            };
        }

        function renderPlaylist() {
            playlistEl.innerHTML = '';
            if (tracks.length === 0) {
                playlistEl.appendChild(emptyMsgEl);
                emptyMsgEl.style.display = 'block';
                return;
            }
            emptyMsgEl.style.display = 'none';

            tracks.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = 'track-item' + (index === currentTrackIndex ? ' active' : '');
                item.onclick = () => selectAndPlayTrack(index);

                const info = document.createElement('div');
                info.className = 'track-info-list';

                const nameEl = document.createElement('div');
                nameEl.className = 'track-name-list';
                nameEl.innerText = track.name;

                info.appendChild(nameEl);

                const delBtn = document.createElement('button');
                delBtn.className = 'track-delete';
                delBtn.innerHTML = '✕';
                delBtn.onclick = (e) => deleteTrackFromDB(track.id, e);

                item.appendChild(info);
                item.appendChild(delBtn);
                playlistEl.appendChild(item);
            });
        }

        function selectAndPlayTrack(index) {
            if (index < 0 || index >= tracks.length) return;
            currentTrackIndex = index;
            const track = tracks[currentTrackIndex];

            trackTitleEl.innerText = track.name;
            trackArtistEl.innerText = "Локальный файл";

            const fileURL = URL.createObjectURL(track.file);
            audioPlayer.src = fileURL;
            audioPlayer.play();
            
            isPlaying = true;
            updatePlayButtonState();
            albumArtEl.classList.add('playing');
            renderPlaylist();
            setupMediaSession(track);
        }

        // Интеграция с системным плеером, экраном блокировки и Dynamic Island
        function setupMediaSession(track) {
            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: track.name,
                    artist: 'Telegram Beats',
                    album: 'Локальная музыка',
                    artwork: [
                        { src: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=512&h=512&fit=crop', sizes: '512x512', type: 'image/jpeg' }
                    ]
                });

                navigator.mediaSession.setActionHandler('play', () => { togglePlayPause(); });
                navigator.mediaSession.setActionHandler('pause', () => { togglePlayPause(); });
                navigator.mediaSession.setActionHandler('previoustrack', () => { playPrev(); });
                navigator.mediaSession.setActionHandler('nexttrack', () => { playNext(); });
            }
        }

        function togglePlayPause() {
            if (tracks.length === 0) return;
            if (currentTrackIndex === -1) {
                selectAndPlayTrack(0);
                return;
            }

            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
                albumArtEl.classList.remove('playing');
            } else {
                audioPlayer.play();
                isPlaying = true;
                albumArtEl.classList.add('playing');
            }
            updatePlayButtonState();
        }

        function updatePlayButtonState() {
            playPauseBtn.innerText = isPlaying ? '⏸' : '▶';
        }

        function playNext() {
            if (tracks.length === 0) return;
            let nextIndex;
            if (isShuffle) {
                do {
                    nextIndex = Math.floor(Math.random() * tracks.length);
                } while (nextIndex === currentTrackIndex && tracks.length > 1);
            } else {
                nextIndex = currentTrackIndex + 1;
                if (nextIndex >= tracks.length) nextIndex = 0;
            }
            selectAndPlayTrack(nextIndex);
        }

        function playPrev() {
            if (tracks.length === 0) return;
            let prevIndex = currentTrackIndex - 1;
            if (prevIndex < 0) prevIndex = tracks.length - 1;
            selectAndPlayTrack(prevIndex);
        }

        function toggleShuffle() {
            isShuffle = !isShuffle;
            shuffleBtn.classList.toggle('active', isShuffle);
        }

        function toggleRepeat() {
            repeatMode = (repeatMode + 1) % 3;
            if (repeatMode === 0) {
                repeatBtn.classList.remove('active');
                repeatBtn.innerHTML = '🔁';
                repeatBtn.title = 'Повтор: выкл';
            } else if (repeatMode === 1) {
                repeatBtn.classList.add('active');
                repeatBtn.innerHTML = '🔁';
                repeatBtn.title = 'Повтор: все';
            } else if (repeatMode === 2) {
                repeatBtn.classList.add('active');
                repeatBtn.innerHTML = '🔂';
                repeatBtn.title = 'Повтор: один';
            }
        }

        function resetPlayerUI() {
            trackTitleEl.innerText = 'Трек не выбран';
            trackArtistEl.innerText = 'Ожидание воспроизведения';
            isPlaying = false;
            updatePlayButtonState();
            albumArtEl.classList.remove('playing');
            progressBar.value = 0;
            currentTimeEl.innerText = '0:00';
            totalDurationEl.innerText = '0:00';
        }

        // Управление прогрессом
        audioPlayer.ontimeupdate = () => {
            if (audioPlayer.duration) {
                const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                progressBar.value = progress;
                currentTimeEl.innerText = formatTime(audioPlayer.currentTime);
                totalDurationEl.innerText = formatTime(audioPlayer.duration);
            }
        };

        progressBar.oninput = () => {
            if (audioPlayer.duration) {
                audioPlayer.currentTime = (progressBar.value / 100) * audioPlayer.duration;
            }
        };

        // Обработка окончания трека
        audioPlayer.onended = () => {
            if (repeatMode === 2) {
                // Повтор текущего трека
                audioPlayer.currentTime = 0;
                audioPlayer.play();
            } else {
                playNext();
            }
        };

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        initDB().catch(err => console.error('Ошибка БД:', err));
    </script>
</body>
</html>
