<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Music Player</title>
    <!-- Подключаем официальный SDK Telegram Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #121212);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #aaaaaa);
            --button-color: var(--tg-theme-button-color, #1DB954);
            --button-text-color: var(--tg-theme-button-text-color, #ffffff);
            --card-bg: rgba(255, 255, 255, 0.05);
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        h2 {
            margin: 0 0 4px 0;
            font-size: 20px;
            text-align: center;
        }
        .upload-section {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .btn {
            background-color: var(--button-color);
            color: var(--button-text-color);
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        input[type="file"] {
            display: none;
        }
        .player-card {
            background: var(--card-bg);
            padding: 16px;
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            align-items: center;
        }
        .current-track {
            font-size: 14px;
            font-weight: 500;
            text-align: center;
            word-break: break-all;
            color: var(--text-color);
        }
        audio {
            width: 100%;
            outline: none;
        }
        .playlist {
            background: var(--card-bg);
            border-radius: 14px;
            padding: 10px;
            max-height: 260px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .track-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 8px;
            cursor: pointer;
        }
        .track-item.active {
            background: rgba(29, 185, 84, 0.25);
        }
        .track-info {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            flex-grow: 1;
            margin-right: 10px;
            font-size: 13px;
        }
        .track-delete {
            background: none;
            border: none;
            color: #ff5252;
            cursor: pointer;
            font-size: 15px;
            padding: 2px 6px;
        }
        .empty-list {
            color: var(--hint-color);
            text-align: center;
            font-size: 13px;
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🎵 Мой Муз. Плеер</h2>

        <!-- Кнопка загрузки треков -->
        <div class="upload-section">
            <label for="file-input" class="btn">📂 Добавить MP3 треки</label>
            <input type="file" id="file-input" accept="audio/*" multiple onchange="handleFilesUpload(event)">
        </div>

        <!-- Блок плеера -->
        <div class="player-card">
            <div class="current-track" id="current-track-title">Выберите трек из плейлиста</div>
            <audio id="audio-player" controls></audio>
        </div>

        <!-- Список треков -->
        <div class="playlist" id="playlist">
            <div class="empty-list" id="empty-msg">Плейлист пока пуст</div>
        </div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand(); // Разворачиваем во весь экран мобилки

        let db;
        const DB_NAME = 'TelegramMusicDB';
        const STORE_NAME = 'tracks';

        // Инициализация локальной базы данных IndexedDB
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    loadTracksFromDB();
                    resolve(db);
                };
                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    if (!database.objectStoreNames.contains(STORE_NAME)) {
                        database.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                    }
                };
            });
        }

        let tracks = [];
        let currentTrackId = null;

        const audioPlayer = document.getElementById('audio-player');
        const playlistEl = document.getElementById('playlist');
        const currentTitleEl = document.getElementById('current-track-title');
        const emptyMsgEl = document.getElementById('empty-msg');

        async function handleFilesUpload(event) {
            const files = event.target.files;
            if (!files.length) return;

            for (let file of files) {
                await saveTrackToDB(file);
            }
            event.target.value = ''; 
            loadTracksFromDB();
        }

        function saveTrackToDB(file) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const trackData = {
                    name: file.name,
                    file: file,
                    dateAdded: new Date()
                };
                const request = store.add(trackData);
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        function loadTracksFromDB() {
            const transaction = db.transaction([STORE_NAME], 'readonly');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.getAll();

            request.onsuccess = () => {
                tracks = request.result;
                renderPlaylist();
            };
        }

        function deleteTrackFromDB(id, event) {
            event.stopPropagation();
            const transaction = db.transaction([STORE_NAME], 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.delete(id);

            request.onsuccess = () => {
                if (currentTrackId === id) {
                    audioPlayer.pause();
                    audioPlayer.src = '';
                    currentTitleEl.innerText = 'Трек не выбран';
                    currentTrackId = null;
                }
                loadTracksFromDB();
            };
        }

        function renderPlaylist() {
            playlistEl.innerHTML = '';
            if (tracks.length === 0) {
                playlistEl.appendChild(emptyMsgEl);
                emptyMsgEl.style.display = 'block';
                return;
            }
            emptyMsgEl.style.display = 'none';

            tracks.forEach(track => {
                const item = document.createElement('div');
                item.className = 'track-item' + (track.id === currentTrackId ? ' active' : '');
                item.onclick = () => playTrack(track.id);

                const info = document.createElement('div');
                info.className = 'track-info';
                info.innerText = track.name;

                const delBtn = document.createElement('button');
                delBtn.className = 'track-delete';
                delBtn.innerHTML = '✕';
                delBtn.onclick = (e) => deleteTrackFromDB(track.id, e);

                item.appendChild(info);
                item.appendChild(delBtn);
                playlistEl.appendChild(item);
            });
        }

        function playTrack(id) {
            const track = tracks.find(t => t.id === id);
            if (!track) return;

            currentTrackId = id;
            currentTitleEl.innerText = track.name;

            const fileURL = URL.createObjectURL(track.file);
            audioPlayer.src = fileURL;
            audioPlayer.play();

            renderPlaylist();
        }

        // Автоматический переход к следующему треку по окончании текущего
        audioPlayer.onended = () => {
            const currentIndex = tracks.findIndex(t => t.id === currentTrackId);
            if (currentIndex !== -1 && currentIndex + 1 < tracks.length) {
                playTrack(tracks[currentIndex + 1].id);
            }
        };

        // Запуск инициализации базы данных
        initDB().catch(err => console.error('Ошибка БД:', err));
    </script>
</body>
</html>
