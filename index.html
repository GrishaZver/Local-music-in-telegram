<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Telegram Music Player</title>
    <!-- Официальный SDK Telegram Mini Apps -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root {
            --bg-color: var(--tg-theme-bg-color, #0b0b0e);
            --text-color: var(--tg-theme-text-color, #ffffff);
            --hint-color: var(--tg-theme-hint-color, #8e8e93);
            --accent-color: #1DB954; /* Фирменный зеленый Spotify */
            --accent-gradient: linear-gradient(135deg, #1DB954, #1ed760);
            --card-bg: rgba(255, 255, 255, 0.04);
            --card-border: rgba(255, 255, 255, 0.08);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-sizing: border-box;
            min-height: 100vh;
        }

        .container {
            width: 100%;
            max-width: 390px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .header {
            text-align: center;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: -4px;
        }

        /* Обложка и визуализация */
        .player-hero {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 24px 20px;
            border-radius: 24px;
            backdrop-filter: blur(20px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        .album-art {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: linear-gradient(45deg, #282828, #181818);
            border: 3px solid rgba(255,255,255,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.5);
            transition: transform 0.5s ease;
        }

        .album-art.playing {
            animation: spin 10s linear infinite;
            border-color: var(--accent-color);
            box-shadow: 0 0 25px rgba(29, 185, 84, 0.4);
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .track-meta {
            text-align: center;
            width: 100%;
        }

        .track-title {
            font-size: 16px;
            font-weight: 600;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .track-artist {
            font-size: 13px;
            color: var(--hint-color);
        }

        /* Прогресс-бар */
        .progress-container {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .progress-bar {
            width: 100%;
            -webkit-appearance: none;
            appearance: none;
            background: rgba(255, 255, 255, 0.15);
            height: 5px;
            border-radius: 3px;
            outline: none;
            cursor: pointer;
        }

        .progress-bar::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--text-color);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .progress-bar::-webkit-slider-thumb:hover {
            transform: scale(1.3);
        }

        .time-info {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            color: var(--hint-color);
        }

        /* Элементы управления */
        .controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 24px;
            margin-top: 4px;
        }

        .control-btn {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 22px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.1s, opacity 0.2s;
            opacity: 0.8;
        }

        .control-btn:hover {
            opacity: 1;
        }

        .control-btn:active {
            transform: scale(0.9);
        }

        .play-pause-btn {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--accent-gradient);
            color: #000;
            font-size: 22px;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(29, 185, 84, 0.4);
            transition: transform 0.1s;
        }

        .play-pause-btn:active {
            transform: scale(0.95);
        }

        /* Кнопка загрузки */
        .upload-btn {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            color: var(--text-color);
            padding: 12px;
            border-radius: 14px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            text-align: center;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .upload-btn:hover {
            background: rgba(255, 255, 255, 0.08);
        }

        input[type="file"] {
            display: none;
        }

        /* Плейлист */
        .playlist-card {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            border-radius: 20px;
            padding: 14px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 220px;
            overflow-y: auto;
        }

        .playlist-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--hint-color);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding-left: 4px;
            margin-bottom: 2px;
        }

        .track-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .track-item:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .track-item.active {
            background: rgba(29, 185, 84, 0.15);
            border: 1px solid rgba(29, 185, 84, 0.3);
        }

        .track-info-list {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
            margin-right: 10px;
            flex-grow: 1;
        }

        .track-name-list {
            font-size: 14px;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .track-delete {
            background: none;
            border: none;
            color: var(--hint-color);
            cursor: pointer;
            font-size: 16px;
            padding: 4px;
            transition: color 0.2s;
        }

        .track-delete:hover {
            color: #ff5252;
        }

        .empty-list {
            color: var(--hint-color);
            text-align: center;
            font-size: 13px;
            padding: 20px;
        }

        /* Кастомный скроллбар */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header">🎧 Music Mini App</div>

        <!-- Главный плеер -->
        <div class="player-hero">
            <div class="album-art" id="album-art">🎵</div>
            
            <div class="track-meta">
                <div class="track-title" id="track-title">Трек не выбран</div>
                <div class="track-artist" id="track-artist">Локальный плеер</div>
            </div>

            <!-- Прогресс бар -->
            <div class="progress-container">
                <input type="range" class="progress-bar" id="progress-bar" value="0" min="0" max="100" step="0.1">
                <div class="time-info">
                    <span id="current-time">0:00</span>
                    <span id="total-duration">0:00</span>
                </div>
            </div>

            <!-- Кнопки управления -->
            <div class="controls">
                <button class="control-btn" onclick="playPrev()" title="Назад">⏮</button>
                <button class="play-pause-btn" id="play-pause-btn" onclick="togglePlayPause()">▶</button>
                <button class="control-btn" onclick="playNext()" title="Вперед">⏭</button>
            </div>
        </div>

        <!-- Кнопка добавления -->
        <label for="file-input" class="upload-btn">
            📂 Загрузить музыку (MP3)
        </label>
        <input type="file" id="file-input" accept="audio/*" multiple onchange="handleFilesUpload(event)">

        <!-- Плейлист -->
        <div class="playlist-card">
            <div class="playlist-title">Плейлист</div>
            <div id="playlist" style="display: flex; flex-direction: column; gap: 6px;">
                <div class="empty-list" id="empty-msg">Список пуст. Добавьте треки!</div>
            </div>
        </div>
    </div>

    <!-- Скрытый аудио элемент -->
    <audio id="audio-player"></audio>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        let db;
        const DB_NAME = 'TelegramMusicDB_v2';
        const STORE_NAME = 'tracks';

        let tracks = [];
        let currentTrackIndex = -1;
        let isPlaying = false;

        const audioPlayer = document.getElementById('audio-player');
        const playlistEl = document.getElementById('playlist');
        const trackTitleEl = document.getElementById('track-title');
        const trackArtistEl = document.getElementById('track-artist');
        const emptyMsgEl = document.getElementById('empty-msg');
        const albumArtEl = document.getElementById('album-art');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const progressBar = document.getElementById('progress-bar');
        const currentTimeEl = document.getElementById('current-time');
        const totalDurationEl = document.getElementById('total-duration');

        // Инициализация IndexedDB
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, 1);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    loadTracksFromDB();
                    resolve(db);
                };
                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    if (!database.objectStoreNames.contains(STORE_NAME)) {
                        database.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                    }
                };
            });
        }

        async function handleFilesUpload(event) {
            const files = event.target.files;
            if (!files.length) return;

            for (let file of files) {
                await saveTrackToDB(file);
            }
            event.target.value = '';
            loadTracksFromDB();
        }

        function saveTrackToDB(file) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction([STORE_NAME], 'readwrite');
                const store = transaction.objectStore(STORE_NAME);
                const trackData = {
                    name: file.name.replace(/\.[^/.]+$/, ""), // Убираем расширение для красоты
                    filename: file.name,
                    file: file,
                    dateAdded: new Date()
                };
                const request = store.add(trackData);
                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        function loadTracksFromDB() {
            const transaction = db.transaction([STORE_NAME], 'readonly');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.getAll();

            request.onsuccess = () => {
                tracks = request.result;
                renderPlaylist();
                if (currentTrackIndex === -1 && tracks.length > 0) {
                    // Автоматически выбираем первый трек, но не запускаем
                }
            };
        }

        function deleteTrackFromDB(id, event) {
            event.stopPropagation();
            const transaction = db.transaction([STORE_NAME], 'readwrite');
            const store = transaction.objectStore(STORE_NAME);
            const request = store.delete(id);

            request.onsuccess = () => {
                const deletedIndex = tracks.findIndex(t => t.id === id);
                if (deletedIndex === currentTrackIndex) {
                    audioPlayer.pause();
                    audioPlayer.src = '';
                    currentTrackIndex = -1;
                    resetPlayerUI();
                } else if (deletedIndex < currentTrackIndex) {
                    currentTrackIndex--;
                }
                loadTracksFromDB();
            };
        }

        function renderPlaylist() {
            playlistEl.innerHTML = '';
            if (tracks.length === 0) {
                playlistEl.appendChild(emptyMsgEl);
                emptyMsgEl.style.display = 'block';
                return;
            }
            emptyMsgEl.style.display = 'none';

            tracks.forEach((track, index) => {
                const item = document.createElement('div');
                item.className = 'track-item' + (index === currentTrackIndex ? ' active' : '');
                item.onclick = () => selectAndPlayTrack(index);

                const info = document.createElement('div');
                info.className = 'track-info-list';

                const nameEl = document.createElement('div');
                nameEl.className = 'track-name-list';
                nameEl.innerText = track.name;

                info.appendChild(nameEl);

                const delBtn = document.createElement('button');
                delBtn.className = 'track-delete';
                delBtn.innerHTML = '✕';
                delBtn.onclick = (e) => deleteTrackFromDB(track.id, e);

                item.appendChild(info);
                item.appendChild(delBtn);
                playlistEl.appendChild(item);
            });
        }

        function selectAndPlayTrack(index) {
            if (index < 0 || index >= tracks.length) return;
            currentTrackIndex = index;
            const track = tracks[currentTrackIndex];

            trackTitleEl.innerText = track.name;
            trackArtistEl.innerText = "Локальный файл";

            const fileURL = URL.createObjectURL(track.file);
            audioPlayer.src = fileURL;
            audioPlayer.play();
            
            isPlaying = true;
            updatePlayButtonState();
            albumArtEl.classList.add('playing');
            renderPlaylist();
        }

        function togglePlayPause() {
            if (tracks.length === 0) return;
            if (currentTrackIndex === -1) {
                selectAndPlayTrack(0);
                return;
            }

            if (isPlaying) {
                audioPlayer.pause();
                isPlaying = false;
                albumArtEl.classList.remove('playing');
            } else {
                audioPlayer.play();
                isPlaying = true;
                albumArtEl.classList.add('playing');
            }
            updatePlayButtonState();
        }

        function updatePlayButtonState() {
            playPauseBtn.innerText = isPlaying ? '⏸' : '▶';
        }

        function playNext() {
            if (tracks.length === 0) return;
            let nextIndex = currentTrackIndex + 1;
            if (nextIndex >= tracks.length) nextIndex = 0; // Цикл
            selectAndPlayTrack(nextIndex);
        }

        function playPrev() {
            if (tracks.length === 0) return;
            let prevIndex = currentTrackIndex - 1;
            if (prevIndex < 0) prevIndex = tracks.length - 1;
            selectAndPlayTrack(prevIndex);
        }

        function resetPlayerUI() {
            trackTitleEl.innerText = 'Трек не выбран';
            trackArtistEl.innerText = 'Локальный плеер';
            isPlaying = false;
            updatePlayButtonState();
            albumArtEl.classList.remove('playing');
            progressBar.value = 0;
            currentTimeEl.innerText = '0:00';
            totalDurationEl.innerText = '0:00';
        }

        // Обновление прогресс-бара
        audioPlayer.ontimeupdate = () => {
            if (audioPlayer.duration) {
                const progress = (audioPlayer.currentTime / audioPlayer.duration) * 100;
                progressBar.value = progress;
                currentTimeEl.innerText = formatTime(audioPlayer.currentTime);
                totalDurationEl.innerText = formatTime(audioPlayer.duration);
            }
        };

        // Перемотка трека ползунком
        progressBar.oninput = () => {
            if (audioPlayer.duration) {
                audioPlayer.currentTime = (progressBar.value / 100) * audioPlayer.duration;
            }
        };

        // Авто-переход к следующему треку
        audioPlayer.onended = () => {
            playNext();
        };

        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        // Запуск базы данных
        initDB().catch(err => console.error('Ошибка БД:', err));
    </script>
</body>
</html>
